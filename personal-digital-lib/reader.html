<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Module Reader · Data Science Digital Lib</title>
<style>
:root{color-scheme:dark;--bg:#09080f;--panel:#15121f;--panel2:#211a31;--lav:#c4a7ff;--lav2:#8e63e6;--line:#383047;--text:#f5f0ff;--muted:#b8aecb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#211532,transparent 40%),var(--bg);color:var(--text);font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 5%;background:#100d19ee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}h1{font-size:clamp(20px,3vw,30px);margin:0}a,.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--lav);color:#171020;text-decoration:none;font-weight:800;border:0;cursor:pointer}main{max-width:1200px;margin:auto;padding:22px 18px}p{color:var(--muted);line-height:1.6}#reader{width:100%;height:calc(100vh - 180px);min-height:480px;border:1px solid var(--line);border-radius:14px;background:#fff}footer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px}</style></head>
<body><header><h1>Data Science Digital Lib · Reader</h1><div><a href="index.html">← Main dashboard</a></div></header><main><h2 id="title">Study material</h2><p>Read the presentation here without downloading the PowerPoint. Use your browser's PDF controls to zoom or print.</p><iframe id="reader" title="Study material PDF"></iframe><footer><a id="downloadPdf" href="#" download>Download PDF</a><a id="downloadPpt" href="#">Download PowerPoint</a></footer></main>
<script>
const q=new URLSearchParams(location.search);const file=q.get('file');const title=q.get('title')||'Study material';document.getElementById('title').textContent=title;const safeFile=file&&file.startsWith('pdfs/')&&!file.includes('..')?file:null;if(safeFile){document.getElementById('reader').src=safeFile;document.getElementById('downloadPdf').href=safeFile;const base=safeFile.split('/').pop().replace('.pdf','.pptx');let ppt=base==='Mutual_Fund_Analytics_Dashboard.pptx'?'projects/'+base:'modules/'+base;document.getElementById('downloadPpt').href=ppt;document.getElementById('downloadPpt').setAttribute('download','');}else{document.getElementById('reader').remove();document.querySelector('main p').textContent='No valid module selected. Return to the main dashboard.';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')location.href='index.html'});
</script></body></html>
